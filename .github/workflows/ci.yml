
name: DevOps Pilot AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run routing tests
        run: |
          python -m pytest tests/test_routing.py -v

  docker:
    name: Build and Publish Docker Image
    runs-on: ubuntu-latest
    needs: test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/jyothi162/devops-pilot-ai:latest
            ghcr.io/jyothi162/devops-pilot-ai:sha-${{ github.sha }}


  deploy:
    name: Deploy to Azure Container Apps
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: 6e98e704-94b8-4ea6-8330-232dc9c0bbdf
          tenant-id: f419c9fe-f7b0-4d87-bee8-e8dfb2190cab
          subscription-id: 2d00d166-4074-41c6-8f61-d07cbc0cc012

      - name: Deploy Docker image to Azure
        run: |
          az containerapp update \
            --name devops-pilot-ai \
            --resource-group rg-devops-pilot-ai \
            --image ghcr.io/jyothi162/devops-pilot-ai:sha-${{ github.sha }}
